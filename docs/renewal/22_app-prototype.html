<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오디션패스 — 앱 프로토타입 (22)</title>
<style>
/* ============================================================
   AUDITIONPASS · APP PROTOTYPE 22 · 「콜 시트」 디자인 언어 v2
   기준: 20_design-language.md / 23_design-system.md
   ============================================================ */
:root{
  --paper:#FAFAF7;
  --surface:#FFFFFF;
  --ink:#141414;
  --ink-70:#4A4A48;
  --ink-40:#8A8A86;
  --line:#E7E5E0;
  --line-app:#F0F0EE;
  --primary:#4F46E5;
  --primary-ink:#3730A3;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --ink-inverse:#FAFAF7;
  --dark:#161615;
  --shadow-raised:0 1px 2px rgba(20,20,20,.04),0 8px 24px rgba(20,20,20,.08);
  --shadow-overlay:0 -4px 16px rgba(20,20,20,.06),0 -24px 48px rgba(20,20,20,.10);
  --r-control:12px;
  --r-sheet:22px;
  --fill:#F4F4F2;
  --fill-weak:rgba(20,20,20,.045);
  --dur-fast:150ms;
  --dur-base:250ms;
  --dur-slow:400ms;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --ease-sheet:cubic-bezier(0.32,0.72,0,1);
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
  overflow:hidden;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}
ul{list-style:none}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}

/* ── 유틸리티 ─────────────────────────────── */
.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-40)}
.tabular{font-variant-numeric:tabular-nums}
.pressable{transition:transform 100ms var(--ease-out)}
.pressable:active{transform:scale(0.98)}
.hairline{border-bottom:1px solid var(--line-app)}

/* ── 데스크톱 스테이지 ─────────────────────── */
.stagewrap{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:var(--paper);
}
.stage-caption{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  color:var(--ink-40);text-transform:uppercase;
}
.stage-lines{position:fixed;inset:0;pointer-events:none}
.stage-lines::before,.stage-lines::after{
  content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line);
}
.stage-lines::before{left:calc(50% - 290px)}
.stage-lines::after{left:calc(50% + 289px)}

/* ── 폰 프레임 ────────────────────────────── */
.phone{
  position:relative;width:390px;height:844px;max-height:calc(100vh - 70px);
  background:#0B0B0A;border-radius:52px;
  box-shadow:0 2px 6px rgba(20,20,20,.10),0 32px 72px rgba(20,20,20,.22);
  padding:5px;flex-shrink:0;
}
.phone-screen{
  position:relative;width:100%;height:100%;
  background:var(--surface);border-radius:47px;overflow:hidden;
}
.island{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;border-radius:18px;background:#0B0B0A;z-index:200;
}
.homebar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:132px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:200;
  pointer-events:none;
}

@media (max-width:520px),(max-height:900px) and (max-width:520px){
  .stagewrap{padding:0}
  .stage-caption,.stage-lines{display:none}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}
  .phone-screen{border-radius:0}
  .island,.homebar{display:none}
}

/* ── 앱 셸 ────────────────────────────────── */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.statusbar{
  flex-shrink:0;height:54px;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 30px 6px;
  font-size:14px;font-weight:600;position:relative;z-index:150;background:var(--surface);
}
.statusbar .sb-icons{display:flex;align-items:center;gap:6px}

#stage{position:relative;flex:1;min-height:0}

/* ── 스크린 공통 ──────────────────────────── */
.screen{
  position:absolute;inset:0;background:var(--surface);
  overflow-y:auto;overscroll-behavior:contain;display:none;
  scrollbar-width:none;overflow-anchor:none;
}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.screen.anim{animation:tab-in 200ms var(--ease-out) both}
@keyframes tab-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* iOS 네브바: 기본 투명 → 스크롤 시 hairline + blur + 센터 타이틀 등장 */
.hdr{
  position:sticky;top:0;z-index:5;height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;background:transparent;
  border-bottom:1px solid transparent;
  transition:background-color 200ms,border-color 200ms;
}
.hdr.scrolled{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom-color:var(--line-app);
}
.hdr .hdr-side{display:flex;align-items:center;min-width:52px}
.hdr .hdr-ctitle{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:17px;font-weight:600;letter-spacing:-.015em;
  max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity 200ms var(--ease-out);pointer-events:none;
}
.hdr.scrolled .hdr-ctitle{opacity:1}
.lt-wrap{padding:2px 20px 4px}
.lt-wrap .mono{display:block;margin-bottom:7px}
.large-title{font-size:31px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.icon-btn{
  width:44px;height:44px;display:grid;place-items:center;
  color:var(--ink-70);border-radius:var(--r-control);
}
.icon-btn:active{transform:scale(0.94)}

.page-pad{padding:0 20px}
.sect{padding-top:26px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin-bottom:6px}
.sect-head h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.sect-more{font-size:13px;color:var(--ink-40);display:inline-flex;align-items:center;gap:2px;min-height:32px}

/* ── 리스트 로우 (인셋 디바이더) ─────────────── */
.rows{border-top:none}
.row{
  position:relative;padding:14px 20px 13px;
  cursor:pointer;transition:background-color 120ms,transform 100ms var(--ease-out);
}
.row::after{content:"";position:absolute;left:20px;right:0;bottom:0;height:1px;background:var(--line-app)}
.rows li:last-child.row::after{display:none}
.row:active{background:rgba(20,20,20,.04);transform:scale(0.99)}
.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.row-title{
  font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.dday{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--ink-40);flex-shrink:0;padding-top:2px;letter-spacing:.02em}
.dday.warn{color:var(--warning)}
.dday.hot{color:var(--danger)}
.row-org{margin-top:3px;font-size:13px;color:var(--ink-40)}
.row-meta{margin-top:5px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-40);font-variant-numeric:tabular-nums}
.row-badges{margin-top:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.closed{opacity:.5}

/* 원클릭 오디션 가로 스냅 캐러셀 (홈 최상단) */
.carousel{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:10px 20px 4px;scrollbar-width:none;overscroll-behavior-x:contain;
}
.carousel::-webkit-scrollbar{display:none}
.ccard{
  scroll-snap-align:start;flex:0 0 288px;cursor:pointer;
  background:var(--fill);border-radius:16px;padding:16px;
  transition:transform 100ms var(--ease-out);
}
.ccard:active{transform:scale(0.98)}
.cc-top{display:flex;align-items:center;justify-content:space-between}
.cc-title{
  margin-top:11px;font-size:17px;font-weight:600;line-height:1.32;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:45px;
}
.cc-meta{margin-top:9px;font-size:13px;color:var(--ink-70)}
.cc-meta2{margin-top:2px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-40);font-variant-numeric:tabular-nums}

/* 마감 임박 로우 (홈) — 유일한 위계 차등 */
.row.urgent{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.urgent-d .d-date{white-space:nowrap}
.urgent-d{padding-top:1px}
.urgent-d .d-num{font-family:var(--font-mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.urgent-d .d-date{margin-top:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-40)}

/* ── 배지 ─────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;line-height:1.3}
.badge.oneclick{background:var(--success);color:#fff}
.badge.site{background:var(--ink-40);color:#fff}
.badge.genre{background:rgba(20,20,20,.06);color:var(--ink-70)}
.badge.applied-mark{background:transparent;border:1px solid var(--line);color:var(--ink-40);font-weight:500}

/* 상태 칩 (지원 탭) */
.stchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-70)}
.stchip .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-40)}
.stchip.read .dot{background:var(--success)}
.stchip.closed{color:var(--ink-40)}
.stchip.closed .dot{background:var(--line)}

/* ── 버튼 ─────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:var(--r-control);font-weight:600;
  transition:background-color var(--dur-fast) var(--ease-out),transform 100ms var(--ease-out),opacity var(--dur-fast);
}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-ink)}
.btn-secondary{background:var(--fill-weak);color:var(--ink)}
.btn-secondary:active{background:rgba(20,20,20,.09)}
.btn-ghost{color:var(--ink-70)}
.btn-md{height:46px;padding:0 18px;font-size:15px;border-radius:12px}
.btn-lg{height:52px;padding:0 24px;font-size:17px;width:100%;border-radius:14px}
.btn-sm{height:36px;padding:0 12px;font-size:13px}

/* ── 칩 ───────────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;height:34px;padding:0 14px;flex-shrink:0;
  border-radius:999px;border:none;
  background:var(--fill-weak);color:var(--ink-70);font-size:14px;font-weight:500;
  transition:background-color 150ms,color 150ms,transform 100ms var(--ease-out);
  cursor:pointer;white-space:nowrap;
}
.chip:active{transform:scale(0.96)}
.chip.on{background:var(--ink);color:var(--ink-inverse);font-weight:600}
.chip-rack{display:flex;gap:7px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
.chip-rack::-webkit-scrollbar{display:none}
.chip-wrap{display:flex;gap:7px;flex-wrap:wrap}

/* ── 탐색: 검색/필터 바 ────────────────────── */
.search-bar{display:flex;gap:8px;padding:8px 20px 0}
.search-field{
  flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;
  border-radius:12px;background:var(--fill-weak);color:var(--ink-40);
}
.search-field input{border:none;outline:none;background:none;flex:1;font-size:16px;color:var(--ink);min-width:0}
.search-field input::placeholder{color:var(--ink-40)}
.filter-btn{
  width:42px;height:42px;display:grid;place-items:center;position:relative;
  border:none;border-radius:12px;color:var(--ink-70);background:var(--fill-weak);
}
.filter-btn .fdot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:0;transition:opacity 150ms}
.filter-btn.has .fdot{opacity:1}

/* ── 스켈레톤 ─────────────────────────────── */
.skel{
  background:linear-gradient(90deg,#F0F0EE 25%,#FAFAF7 50%,#F0F0EE 75%);
  background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite;
  border-radius:6px;
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-row{padding:15px 20px 14px;border-bottom:1px solid var(--line-app)}
.skel-row .l1{height:15px;width:74%}
.skel-row .l2{height:12px;width:42%;margin-top:9px}
.skel-row .l3{display:flex;gap:6px;margin-top:11px}
.skel-row .l3 .skel{height:20px;width:56px;border-radius:999px}

/* ── 스태거 ───────────────────────────────── */
.stagger-run .stg{opacity:0;animation:row-in var(--dur-base) var(--ease-out) both;animation-delay:calc(var(--i)*35ms)}
@keyframes row-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── 상세 (push) ──────────────────────────── */
.detail{
  position:absolute;inset:0;z-index:20;background:var(--surface);
  display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;
  transition:transform var(--dur-base) var(--ease-out),visibility 0s var(--dur-base);
}
.detail.open{transform:none;visibility:visible;transition:transform var(--dur-base) var(--ease-out)}
.detail-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.detail-scroll::-webkit-scrollbar{display:none}
.detail .hdr{position:relative;flex-shrink:0}

.doc-head{padding:22px 20px 4px}
.doc-no{display:flex;align-items:center;justify-content:space-between}
.doc-title{margin-top:10px;font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.doc-org{margin-top:7px;font-size:14px;color:var(--ink-70)}
.doc-badges{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line-app)}

.field{padding:13px 20px 12px;border-bottom:1px solid var(--line-app)}
.field-val{margin-top:5px;font-size:15px;color:var(--ink);display:flex;align-items:baseline;gap:8px;line-height:1.5}
.field-val .sub{font-size:13px;color:var(--ink-40)}

.doc-body{padding:18px 20px 6px}
.doc-body p{margin-top:6px;font-size:15px;line-height:1.7;color:var(--ink-70)}

.src-row{
  margin:16px 20px 0;display:flex;align-items:center;gap:10px;
  background:var(--fill-weak);border-radius:14px;padding:13px 15px;
  color:var(--ink-70);font-size:13px;cursor:pointer;
}
.src-row:active{background:rgba(20,20,20,.08)}
.src-row .src-host{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;color:var(--ink)}
.src-row .go{margin-left:auto;color:var(--ink-40);font-size:12px;display:inline-flex;align-items:center;gap:3px}

.applybar{
  flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:12px 20px 14px;border-top:1px solid var(--line-app);background:var(--surface);
}
.applybar .ab-left{min-width:76px}
.applybar .ab-d{font-family:var(--font-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.applybar .ab-date{margin-top:2px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-40)}
.applybar .btn{flex:1}

/* ── 탭바 ─────────────────────────────────── */
.tabbar{
  flex-shrink:0;position:relative;display:flex;background:var(--surface);
  border-top:1px solid var(--line-app);padding-bottom:16px;z-index:30;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 4px;min-height:52px;color:var(--ink-40);font-size:11px;font-weight:500;
  transition:color 250ms var(--ease-out);
}
.tab:active{transform:scale(0.96)}
.tab.on{color:var(--primary);font-weight:600}
.tab-ind{
  position:absolute;top:-1px;left:0;width:20%;height:2px;
  transition:transform 250ms var(--ease-out);pointer-events:none;
}
.tab-ind::after{content:"";display:block;width:30px;height:2px;background:var(--primary);margin:0 auto}

/* ── 바텀시트 ─────────────────────────────── */
.sheetwrap{position:absolute;inset:0;z-index:50;visibility:hidden;transition:visibility 0s 260ms}
.sheetwrap.open{visibility:visible;transition:visibility 0s}
.dim{position:absolute;inset:0;background:rgba(20,20,20,.44);opacity:0;transition:opacity var(--dur-base) ease-out}
.sheetwrap.open .dim{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:86%;
  background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;
  transform:translateY(104%);transition:transform 240ms ease-in;
}
.sheetwrap.open .sheet{transform:none;transition:transform var(--dur-slow) var(--ease-sheet)}
.sheet-grip{width:36px;height:5px;border-radius:3px;background:rgba(20,20,20,.16);margin:8px auto 0;flex-shrink:0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 20px;flex-shrink:0}
.sheet-hd h2{font-size:16px;font-weight:700}
.sheet-body{overflow-y:auto;padding:2px 20px 8px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-ft{padding:12px 20px 30px;flex-shrink:0}
.sheet-ft.split{display:flex;gap:10px;align-items:center}
.sheet-ft.split .btn-lg{flex:1;width:auto}

.sheet-view{display:none}
.sheet-view.on{display:block;animation:tab-in 200ms var(--ease-out) both}

/* 시트 내부 폼 */
.f-label{display:block;font-size:14px;font-weight:600;color:var(--ink-70);margin:16px 0 7px}
.f-input{
  width:100%;height:48px;padding:0 15px;font-size:16px;color:var(--ink);
  border:1px solid transparent;border-radius:12px;background:var(--fill-weak);outline:none;
  transition:border-color 150ms;
}
.f-input:focus{border-color:var(--primary);background:var(--surface)}
.seg2{display:flex;gap:8px}
.seg2 .chip{flex:1;justify-content:center;height:46px;border-radius:12px}

/* 지원 확인 시트 요약 */
.confirm-doc{background:var(--fill-weak);border-radius:14px;margin-top:14px;overflow:hidden}
.confirm-line{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-app);font-size:13px;align-items:baseline}
.confirm-line:last-child{border-bottom:none}
.confirm-line .ck{width:64px;flex-shrink:0}
.confirm-line .cv{color:var(--ink);line-height:1.5;font-size:13px}
.profile-strip{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;background:var(--fill-weak);border-radius:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--dark);color:var(--ink-inverse);display:grid;place-items:center;font-size:14px;font-weight:700;flex-shrink:0}
.profile-strip .ps-name{font-size:14px;font-weight:600}
.profile-strip .ps-meta{margin-top:1px;font-size:12px;color:var(--ink-40)}

/* 완료 뷰 */
.done-wrap{padding:26px 0 6px;text-align:center}
.done-ic{
  width:56px;height:56px;margin:0 auto;border-radius:50%;
  border:1.5px solid var(--success);color:var(--success);display:grid;place-items:center;
  animation:pop-in 350ms var(--ease-out) both;
}
@keyframes pop-in{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.done-wrap h3{margin-top:16px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.done-wrap p{margin-top:7px;font-size:14px;line-height:1.6;color:var(--ink-70)}

/* ── 필터 시트 ────────────────────────────── */
.filter-sect{padding-top:6px}
.filter-sect .mono{display:block;margin:14px 0 9px}

/* ── 지원 탭: iOS 세그먼티드 컨트롤 ─────────── */
.segctl{
  display:flex;margin:10px 20px 2px;padding:2px;border-radius:10px;
  background:var(--fill-weak);position:relative;
}
.segbtn{
  flex:1;position:relative;z-index:1;height:34px;border-radius:8px;
  font-size:14px;font-weight:600;color:var(--ink-70);
  transition:color 200ms,background-color 200ms,box-shadow 200ms;
}
.segbtn.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,20,.10),0 0 1px rgba(20,20,20,.08)}
.app-row-date{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-40)}

/* ── 엠티 스테이트 ─────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 32px}
.empty .e-ic{color:var(--ink-40)}
.empty h3{margin-top:16px;font-size:17px;font-weight:600;letter-spacing:-.015em}
.empty p{margin-top:6px;font-size:15px;line-height:1.55;color:var(--ink-70)}
.empty .btn{margin-top:20px}

/* ── 홈 완성도 카드 / 요약 로우 ─────────────── */
.notice-card{
  margin:16px 20px 0;display:flex;align-items:center;gap:14px;
  background:var(--fill-weak);border-radius:16px;padding:14px 16px;cursor:pointer;
}
.notice-card:active{background:rgba(20,20,20,.08)}
.notice-card .nc-t{font-size:14px;font-weight:600;line-height:1.4}
.notice-card .nc-s{margin-top:2px;font-size:12px;color:var(--ink-40);line-height:1.5}
.notice-card .chev{margin-left:auto;color:var(--ink-40)}
.ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .ring-pct{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;
}
.ring-fg{transition:stroke-dashoffset var(--dur-slow) var(--ease-out)}

/* ── MY ───────────────────────────────────── */
.my-card{padding:22px 20px 18px;border-bottom:1px solid var(--line-app);display:flex;align-items:center;gap:16px}
.my-card .avatar{width:52px;height:52px;font-size:18px}
.my-name{font-size:17px;font-weight:700}
.my-chips{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.menu-row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 20px;min-height:52px;font-size:16px;color:var(--ink);
  transition:background-color 120ms,transform 100ms var(--ease-out);
}
.menu-row::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:1px;background:var(--line-app)}
.menu-row:active{background:rgba(20,20,20,.04);transform:scale(0.99)}
.menu-row .chev{margin-left:auto;color:var(--ink-40)}
.menu-row .mi{color:var(--ink-40)}
.switch{
  margin-left:auto;position:relative;width:44px;height:26px;border-radius:13px;
  background:var(--line);transition:background-color 200ms;flex-shrink:0;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(20,20,20,.2);transition:transform 200ms var(--ease-out);
}
.switch.on{background:var(--success)}
.switch.on::after{transform:translateX(18px)}
.logout{display:block;margin:26px auto 40px;font-size:13px;color:var(--ink-40);min-height:44px}

/* ── 온보딩 ───────────────────────────────── */
.onb{
  position:absolute;left:0;right:0;top:54px;bottom:0;z-index:40;background:var(--surface);
  display:flex;flex-direction:column;
  transform:translateY(14px);opacity:0;visibility:hidden;
  transition:transform var(--dur-base) var(--ease-out),opacity var(--dur-base) ease-out,visibility 0s var(--dur-base);
}
.onb.open{transform:none;opacity:1;visibility:visible;transition:transform var(--dur-base) var(--ease-out),opacity var(--dur-base) ease-out}
.onb-hd{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px;flex-shrink:0}
.onb-skip{font-size:13px;color:var(--ink-40);min-height:44px;padding:0 14px}
.stepper{display:flex;align-items:center;gap:10px;padding:2px 20px 0;flex-shrink:0}
.stepper .bars{display:flex;flex:1;gap:4px}
.stepper .bar{height:2px;flex:1;border-radius:1px;background:var(--line);transition:background-color 250ms}
.stepper .bar.on{background:var(--ink)}
.onb-body{flex:1;overflow-y:auto;padding:26px 20px 12px;scrollbar-width:none}
.onb-body::-webkit-scrollbar{display:none}
.onb-step{display:none}
.onb-step.on{display:block;animation:tab-in 200ms var(--ease-out) both}
.onb-title{font-size:22px;font-weight:700;line-height:1.35;letter-spacing:-.02em}
.onb-sub{margin-top:9px;font-size:14px;line-height:1.65;color:var(--ink-70)}
.onb-ft{padding:12px 20px 30px;flex-shrink:0}
.onb-recs{margin:18px -20px 0;border-top:1px solid var(--line-app)}
.rec-flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--success)}

/* ── 토스트 ───────────────────────────────── */
.toast{
  position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);
  z-index:60;display:flex;align-items:center;gap:8px;max-width:330px;
  background:var(--dark);color:var(--ink-inverse);border-radius:var(--r-control);
  padding:12px 16px;font-size:14px;box-shadow:var(--shadow-raised);
  opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-size:14px;font-weight:700;color:#fff;margin-left:4px;white-space:nowrap}

/* ── reduced motion ───────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .skel{background:#F0F0EE;animation:none}
}

/* iOS 네브바 + large title */
function navHTML(title, {left="", right="", large=null, sub=""} = {}){
  return `<header class="hdr">
    <div class="hdr-side">${left}</div>
    <span class="hdr-ctitle">${title}</span>
    <div class="hdr-side" style="justify-content:flex-end">${right}</div>
  </header>
  ${large!==null?`<div class="lt-wrap">${sub?`<span class="mono tabular">${sub}</span>`:""}<h1 class="large-title">${large}</h1></div>`:""}`;
}
function bindNav(scrollEl, hdr, threshold=34){
  hdr = hdr || scrollEl.querySelector(".hdr");
  if(!hdr) return;
  const f = () => hdr.classList.toggle("scrolled", scrollEl.scrollTop > threshold);
  scrollEl.addEventListener("scroll", f, {passive:true});
  f();
}

/* ── D-day 헬퍼 ── */
function ddCls(d){ return d==null ? "" : d<=3 ? "hot" : d<=7 ? "warn" : ""; }
function ddTxt(d){ return d==null ? "마감" : "D-"+d; }
function ddDate(d){
  if(d==null) return "";
  const t = new Date(TODAY); t.setDate(t.getDate()+d);
  return String(t.getMonth()+1).padStart(2,"0")+"."+String(t.getDate()).padStart(2,"0");
}

/* ── 배지 ── */
function methodBadge(x){
  return x.oneclick
    ? `<span class="badge oneclick">원클릭 지원</span>`
    : `<span class="badge site">사이트 지원</span>`;
}
function rowHTML(x, i, opts={}){
  const closed = x.dday==null;
  const appliedMark = state.applied.has(x.id) && !closed ? `<span class="badge applied-mark">지원함</span>` : "";
  return `<li class="row stg ${closed?"closed":""}" style="--i:${i}" data-open="${x.id}">
    <div class="row-top">
      <h3 class="row-title">${esc(x.title)}</h3>
      <span class="dday ${ddCls(x.dday)}">${ddTxt(x.dday)}</span>
    </div>
    <p class="row-org">${esc(x.org)}</p>
    <p class="row-meta">${esc(x.region)} &middot; ${esc(x.pay)}</p>
    <div class="row-badges"><span class="badge genre">${x.cat}</span>${methodBadge(x)}${appliedMark}${opts.recFlag && x.oneclick ? `<span class="rec-flag">${I("check",12,2.2)}바로 지원 가능</span>`:""}</div>
  </li>`;

function urgentRowHTML(x, i){
  return `<li class="row urgent stg" style="--i:${i}" data-open="${x.id}">
    <div class="urgent-d">
      <div class="d-num ${ddCls(x.dday)==="hot"?"":""}" style="color:var(--${x.dday<=3?"danger":"warning"})">D-${x.dday}</div>
      <div class="d-date">DUE ${ddDate(x.dday)}</div>
    </div>
    <div>
      <h3 class="row-title">${esc(x.title)}</h3>
      <p class="row-meta">${esc(x.org)} &middot; ${esc(x.region)} &middot; ${esc(x.pay)}</p>
      <div class="row-badges"><span class="badge genre">${x.cat}</span>${methodBadge(x)}</div>
    </div>
  </li>`;
}
function skelRows(n){
  let h = "";
  for(let k=0;k<n;k++) h += `<div class="skel-row" aria-hidden="true">
    <div class="skel l1"></div><div class="skel l2"></div>
    <div class="l3"><span class="skel"></span><span class="skel"></span></div>
  </div>`;
  return `<div aria-busy="true">${h}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">불러오는 중</span></div>`;
}
function ringHTML(pct, size=44){
  const r = 17, C = 2*Math.PI*r;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 40 40" width="${size}" height="${size}">
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--line)" stroke-width="3.5"/>
      <circle class="ring-fg" cx="20" cy="20" r="${r}" fill="none" stroke="var(--primary)" stroke-width="3.5"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/>
    </svg>
    <span class="ring-pct">${pct}%</span>
  </div>`;
}

function filteredList(f = state.filters){
  return LISTINGS.filter(x=>{
    if(state.query && !(x.title+x.org+x.cat).includes(state.query)) return false;
    if(f.cats.size && !f.cats.has(x.cat)) return false;
    if(f.method==="oneclick" && !x.oneclick) return false;
    if(f.method==="site" && x.oneclick) return false;
    if(f.regions.size){
      const hit = [...f.regions].some(r =>
        r==="서울" ? x.region.includes("서울") :
        r==="경기·인천" ? /파주|성수|판교|마포|경기|인천/.test(x.region) :
        !/서울|파주|성수|판교|마포|경기|인천/.test(x.region));
      if(!hit) return false;
    }
    if(f.pay==="paid" && /협의|무페이/.test(x.pay)) return false;
    if(f.pay==="nego" && !/협의|무페이/.test(x.pay)) return false;
    return true;
  }).sort((a,b)=>(a.dday==null)-(b.dday==null) || (a.dday??99)-(b.dday??99));
}
function filterCount(){
  const f = state.filters;
  return f.cats.size + (f.method?1:0) + f.regions.size + (f.pay?1:0);
}

function renderQuickChips(){
  const rack = $("#quickChips");
  if(!rack) return;
  rack.innerHTML = `<button class="chip ${state.filters.cats.size===0?"on":""}" data-qc="__all">전체</button>` +
    CATS.map(c=>`<button class="chip ${state.filters.cats.has(c)?"on":""}" data-qc="${c}">${c}</button>`).join("");
  rack.querySelectorAll("[data-qc]").forEach(b=>b.addEventListener("click",()=>{
    const v = b.dataset.qc;
    if(v==="__all") state.filters.cats.clear();
    else state.filters.cats.has(v) ? state.filters.cats.delete(v) : state.filters.cats.add(v);
    renderQuickChips();
    $("#openFilter").classList.toggle("has", filterCount()>0);
    renderExploreList(false);
  }));
}

  const box = $("#exploreList");

}

  }

    </div>`;
    ft.innerHTML = `<button class="btn btn-primary btn-lg" id="apSend">지원 메일 보내기</button>`;
    $("#apSend").addEventListener("click",()=>{
      const b = $("#apSend");
      b.disabled = true; b.setAttribute("aria-busy","true");
      b.textContent = "보내는 중…";
      setTimeout(()=>{
        state.applied.set(x.id,"sent");
        state.appliedDates.set(x.id,"07.15");
        drawApplyView("done");
        renderHome();
      }, 900);
    });
  }

  if(view==="done"){
    title.textContent = "";
    body.innerHTML = `<div class="sheet-view on">
      <div class="done-wrap">
        <div class="done-ic">${I("check",26,2)}</div>
        <h3>지원이 완료되었어요</h3>
        <p>${esc(x.org)}에 프로필이 전달됐어요.<br>담당자가 열람하면 지원 탭에서 알려드릴게요.</p>
      </div>
    </div>`;
    ft.innerHTML = `
      <button class="btn btn-primary btn-lg" id="goApps">지원 탭에서 확인</button>
      <button class="btn btn-ghost btn-lg" id="goSimilar" style="margin-top:6px">비슷한 오디션 더 보기</button>`;
    $("#goApps").addEventListener("click",()=>{
      closeSheet("applyWrap"); closeDetail();
      state.appsSeg = "applied"; switchTab("apps");
    });
    $("#goSimilar").addEventListener("click",()=>{
      closeSheet("applyWrap"); closeDetail();
      state.filters = { cats:new Set([x.cat]), method:null, regions:new Set(), pay:null };
      switchTab("explore");
    });
    if(state.detailId===x.id){
      const bar = document.querySelector("#detail .applybar .btn");
      if(bar){ bar.className="btn btn-secondary btn-lg"; bar.disabled=true; bar.textContent="지원함"; }
    }
  }
}

/* ============================================================
   온보딩 3스텝
   ============================================================ */
function openOnboarding(){
  state.onbStep = 1;
  state.onbCats = new Set(state.interests);
  drawOnb();
  const onb = $("#onb");
  onb.classList.add("open");
}
function closeOnboarding(done){
  $("#onb").classList.remove("open");
  if(done){
    if(state.onbCats.size) state.interests = new Set(state.onbCats);
    renderHome(); renderMy();
    toast("온보딩을 마쳤어요. 오늘의 콜시트를 확인해 보세요.");
    switchTab("home");
  }
}
function drawOnb(){
  const s = state.onbStep;
  const recs = LISTINGS.filter(x=>x.dday!=null && (state.onbCats.size ? state.onbCats.has(x.cat) : true))
    .sort((a,b)=>(b.oneclick?1:0)-(a.oneclick?1:0) || a.dday-b.dday).slice(0,4);
  const recsFinal = recs.length ? recs : LISTINGS.filter(x=>x.dday!=null).slice(0,4);

  $("#onb").innerHTML = `
    <div class="onb-hd">
      <button class="icon-btn" id="onbClose" aria-label="닫기">${I("x",20)}</button>
      <span class="mono">ONBOARDING</span>
      <button class="onb-skip" id="onbSkip">${s<3?"건너뛰기":"&nbsp;"}</button>
    </div>
    <div class="stepper" aria-label="3단계 중 ${s}단계">
      <span class="mono tabular">STEP ${s}/3</span>
      <div class="bars">${[1,2,3].map(i=>`<div class="bar ${i<=s?"on":""}"></div>`).join("")}</div>
    </div>
    <div class="onb-body">
      <div class="onb-step ${s===1?"on":""}">
        <h2 class="onb-title">어떤 무대를<br>찾고 계세요?</h2>
        <p class="onb-sub">선택한 분야를 기준으로 공고를 추천해 드려요. 여러 개를 골라도 좋아요.</p>
        <div class="chip-wrap" style="margin-top:20px" id="onbChips">
          ${CATS.map(c=>`<button class="chip ${state.onbCats.has(c)?"on":""}" data-oc="${c}">${c}</button>`).join("")}
        </div>
      </div>
      <div class="onb-step ${s===2?"on":""}">
        <h2 class="onb-title">지원에 필요한<br>최소 정보만 받을게요</h2>
        <p class="onb-sub">이 세 가지면 원클릭 지원을 시작할 수 있어요. 나머지는 나중에 채워도 돼요.</p>
        <label class="f-label" for="onbName">이름</label>
        <input class="f-input" id="onbName" value="${esc(state.profile.name)}" placeholder="실명 또는 활동명">
        <label class="f-label" for="onbYear">출생연도</label>
        <input class="f-input tabular" id="onbYear" inputmode="numeric" value="${esc(state.profile.year)}" placeholder="예: 1999">
        <span class="f-label">성별</span>
        <div class="seg2" id="onbGender">
          <button class="chip ${state.profile.gender==="여성"?"on":""}" data-og="여성">여성</button>
          <button class="chip ${state.profile.gender==="남성"?"on":""}" data-og="남성">남성</button>
        </div>
      </div>
      <div class="onb-step ${s===3?"on":""}">
        <h2 class="onb-title">${esc(state.profile.name)} 님의<br>첫 콜시트예요</h2>
        <p class="onb-sub">선택하신 분야에서 지금 바로 지원할 수 있는 공고부터 모았어요.</p>
        <ul class="onb-recs ${s===3?"stagger-run":""}">
          ${recsFinal.map((x,i)=>rowHTML(x,i,{recFlag:true})).join("")}
        </ul>
      </div>
    </div>
    <div class="onb-ft">
      ${s===1?`<button class="btn btn-primary btn-lg" id="onbNext" ${state.onbCats.size?"":"disabled"}>다음</button>`:""}
      ${s===2?`<button class="btn btn-primary btn-lg" id="onbNext">다음</button>`:""}
      ${s===3?`<button class="btn btn-primary btn-lg" id="onbDone">홈에서 시작하기</button>`:""}
    </div>`;

  $("#onbClose").addEventListener("click",()=>closeOnboarding(false));
  $("#onbSkip").addEventListener("click",()=>{
    if(state.onbStep<3){ state.onbStep++; drawOnb(); } else closeOnboarding(true);
  });
  const chips = $("#onbChips");
  if(chips) chips.querySelectorAll("[data-oc]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.oc;
    state.onbCats.has(v)?state.onbCats.delete(v):state.onbCats.add(v);
    b.classList.toggle("on");
    const nx = $("#onbNext"); if(nx && state.onbStep===1) nx.disabled = !state.onbCats.size;
  }));
  $("#onb").querySelectorAll("[data-og]").forEach(b=>b.addEventListener("click",()=>{
    state.profile.gender=b.dataset.og;
    $("#onb").querySelectorAll("[data-og]").forEach(c=>c.classList.toggle("on",c===b));
  }));
  const nx = $("#onbNext");
  if(nx) nx.addEventListener("click",()=>{
    if(state.onbStep===2){
      const n=$("#onbName").value.trim(), y=$("#onbYear").value.trim();
      if(!n||!y){ toast("이름과 출생연도를 채워 주세요."); return; }
      state.profile.name=n; state.profile.year=y;
      state.hasProfile = true;
    }
    state.onbStep++; drawOnb();
  });
  const dn = $("#onbDone");
  if(dn) dn.addEventListener("click",()=>closeOnboarding(true));
}

/* ============================================================
   시트 열기/닫기 · 토스트
   ============================================================ */
function openSheet(id){ $("#"+id).classList.add("open"); }
function closeSheet(id){ $("#"+id).classList.remove("open"); }
document.querySelectorAll("[data-close]").forEach(el=>{
  el.addEventListener("click",()=>closeSheet(el.dataset.close));
  if(el.classList.contains("icon-btn") && !el.innerHTML.trim()) el.innerHTML = I("x",20);
});

let toastTimer = null;
function toast(msg, actionLabel, actionFn){
  const t = $("#toast");
  t.innerHTML = `${I("check",15,2)}<span>${msg}</span>${actionLabel?`<button id="toastAct">${actionLabel}</button>`:""}`;
  t.classList.add("show");
  if(actionLabel) $("#toastAct").addEventListener("click",()=>{ t.classList.remove("show"); actionFn && actionFn(); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), actionLabel?5000:2600);
}

/* ============================================================
   탭바 & 전환
   ============================================================ */
const TABS = [
  { key:"home", label:"홈", icon:"home" },
  { key:"explore", label:"탐색", icon:"search" },
  { key:"apps", label:"지원", icon:"send" },
  { key:"community", label:"커뮤니티", icon:"chat" },
  { key:"my", label:"MY", icon:"user" },
];
const RENDER = { home:renderHome, explore:renderExplore, apps:renderApps, community:renderCommunity, my:renderMy };

function buildTabbar(){
  const bar = $("#tabbar");
  TABS.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.tabkey = t.key;
    b.innerHTML = `${I(t.icon,22)}<span>${t.label}</span>`;
    b.addEventListener("click",()=>{
      if(state.tab===t.key){
        const scr = $("#scr-"+t.key); if(scr) scr.scrollTo({top:0,behavior:"smooth"});
        if($("#detail").classList.contains("open")) closeDetail();
        return;
      }
      switchTab(t.key);
    });
    bar.appendChild(b);
  });
}
function switchTab(key){
  if($("#detail").classList.contains("open")) closeDetail();
  state.tab = key;
  const idx = TABS.findIndex(t=>t.key===key);
  $("#tabInd").style.transform = `translateX(${idx*100}%)`;
  document.querySelectorAll(".tab").forEach(b=>{
    const on = b.dataset.tabkey===key;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current", on?"page":"false");
    b.querySelector("svg").setAttribute("stroke-width", on?"2.1":"1.75");
  });
  document.querySelectorAll(".screen").forEach(s=>{ s.classList.remove("active","anim"); });
  const scr = $("#scr-"+key);
  scr.classList.add("active");

  if(!state.visited[key]){
    /* 첫 진입: 스켈레톤 0.6초 데모 */
    state.visited[key] = true;
    scr.innerHTML = `
      ${navHTML(key==="home"?"오디션패스":TABS[idx].label,{large:key==="home"?"오늘의 콜시트":TABS[idx].label})}
      ${skelRows(7)}`;
    scr.classList.add("anim");
    setTimeout(()=>{
      RENDER[key]();
      scr.scrollTop = 0;
      scr.classList.remove("anim");
      void scr.offsetWidth;
      scr.classList.add("anim");
    }, 600);
  } else {
    RENDER[key]();
    scr.scrollTop = 0;
    void scr.offsetWidth;
    scr.classList.add("anim");
  }
}

/* ============================================================
   전역 위임: 상세 열기 · 탭 이동 · 토스트 · 온보딩
   ============================================================ */
document.addEventListener("click", e=>{
  const open = e.target.closest("[data-open]");
  if(open){ openDetail(Number(open.dataset.open)); return; }
  const oc = e.target.closest("[data-oneclick-all]");
  if(oc){
    state.filters = { cats:new Set(), method:"oneclick", regions:new Set(), pay:null };
    switchTab("explore"); return;
  }
  const tabgo = e.target.closest("[data-tab]");
  if(tabgo){
    const k = tabgo.dataset.tab;
    if(k==="apps") state.appsSeg = "applied";
    switchTab(k); return;
  }
  const tst = e.target.closest("[data-toast]");
  if(tst){ toast(tst.dataset.toast); return; }
  const onb = e.target.closest("[data-onb]");
  if(onb){ openOnboarding(); return; }
});

/* ============================================================
   부팅
   ============================================================ */
if("scrollRestoration" in history) history.scrollRestoration = "manual";
buildTabbar();
switchTab("home");
</script>
