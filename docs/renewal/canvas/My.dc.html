<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;color:#141414;-webkit-font-smoothing:antialiased;}
    a{color:#4F46E5;text-decoration:none} a:hover{color:#3730A3}
    .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A8A86;font-size:11px;}
    .tab.on{color:#4F46E5;font-weight:600;}
    .mrow{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #F0F0EE;font-size:15px;font-weight:500;}
    .mrow svg.lead{color:#4A4A48;flex-shrink:0;}
    .mrow .chev{margin-left:auto;color:#C9C7C1;flex-shrink:0;}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;">

  <!-- 루트형 네브바 -->
  <div style="padding:10px 20px 0;flex-shrink:0;">
    <h1 style="margin:0 0 16px;font-size:28px;font-weight:800;letter-spacing:-0.02em;">MY</h1>
  </div>

  <div style="flex:1;overflow:hidden;padding:0 20px;">
    <!-- 프로필 카드 -->
    <div style="border:1px solid #E7E5E0;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:20px;box-shadow:0 1px 2px rgba(20,20,20,.04),0 8px 24px rgba(20,20,20,.06);">
      <div style="width:56px;height:56px;border-radius:50%;background:#EEF2FF;display:flex;align-items:center;justify-content:center;color:#4F46E5;flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:16px;font-weight:700;margin-bottom:5px;">[지원자 이름]</div>
        <div style="display:flex;gap:5px;">
          <span class="pill" style="background:#ECFDF5;color:#059669;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m4 12 6 6L20 6"/></svg>지원 가능</span>
          <span class="pill" style="background:#FFFBEB;color:#B45309;">컴프카드 미완</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A86" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <!-- 메뉴 -->
    <div class="mrow">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      내가 쓴 글
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div class="mrow">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
      공지사항
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div class="mrow">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2.2-2.5 3.7"/><path d="M12 17h.01"/></svg>
      자주 묻는 질문
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div class="mrow">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
      이용약관
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div class="mrow">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      개인정보 처리방침
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div class="mrow" style="border-bottom:none;">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h9v4"/><path d="M13 20H4V4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      로그아웃
    </div>

    <!-- 지원 메일 주소 -->
    <div style="background:#FAFAF7;border-radius:8px;padding:12px 14px;margin-top:12px;font-size:12.5px;line-height:1.6;color:#8A8A86;">
      문의 support@auditionpass.co.kr · 버전 2.0<br>
      <span style="color:#C9C7C1;">계정 삭제는 개인정보 처리방침 화면 하단에서</span>
    </div>
  </div>

  <!-- 5탭 바 -->
  <div style="border-top:1px solid #F0F0EE;background:#FFFFFF;padding:8px 0 24px;display:flex;flex-shrink:0;">
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      홈
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      탐색
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      지원
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M8 9h8M8 13h5"/><path d="M21 12a8 8 0 1 0-3.1 6.3L21 19l-.9-3.2A8 8 0 0 0 21 12Z"/></svg>
      커뮤니티
    </div>
    <div class="tab on">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6.5 6.5 0 0 1 11 0"/></svg>
      MY
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
