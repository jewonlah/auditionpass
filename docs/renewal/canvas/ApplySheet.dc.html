<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;color:#141414;-webkit-font-smoothing:antialiased;}
    a{color:#4F46E5;text-decoration:none} a:hover{color:#3730A3}
    .mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8A8A86;font-weight:600;}
    .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;position:relative;box-sizing:border-box;">

  <!-- 뒤 배경: 상세 화면 흐릿하게 -->
  <div style="position:absolute;inset:0;padding:20px;opacity:1;">
    <div style="height:52px;display:flex;align-items:center;color:#141414;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="display:flex;gap:6px;margin:10px 0;">
      <span class="pill" style="background:#ECFDF5;color:#059669;">원클릭 지원</span>
      <span class="pill" style="background:#F3F4F6;color:#4A4A48;">키즈모델</span>
    </div>
    <div style="font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-0.02em;">브랜드 화보 다문화 아기모델<br>(키 68~89cm)</div>
    <div style="font-size:13px;color:#8A8A86;margin-top:6px;">디바엔터테인먼트 · 수집 8월 24일</div>
  </div>

  <!-- 딤 -->
  <div style="position:absolute;inset:0;background:rgba(20,20,20,0.44);"></div>

  <!-- 바텀시트 (게이트 ⓒ: 프로필 완비) -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:20px 20px 0 0;box-shadow:0 -8px 32px rgba(20,20,20,0.16);padding:10px 20px 28px;display:flex;flex-direction:column;">
    <div style="width:36px;height:5px;border-radius:999px;background:#E7E5E0;align-self:center;margin-bottom:16px;"></div>

    <span class="mono" style="margin-bottom:6px;">Apply · One-click</span>
    <div style="font-size:19px;font-weight:800;letter-spacing:-0.02em;margin-bottom:14px;">이 프로필로 지원할까요?</div>

    <!-- 프로필 요약 카드 -->
    <div style="border:1px solid #E7E5E0;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;">
      <div style="width:52px;height:52px;border-radius:50%;background:#EEF2FF;display:flex;align-items:center;justify-content:center;color:#4F46E5;flex-shrink:0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:16px;font-weight:700;">[지원자 이름]</div>
        <div style="font-size:13px;color:#8A8A86;margin-top:2px;">키즈모델 · 2024년생 · 보호자 지원</div>
      </div>
      <span class="pill" style="background:#ECFDF5;color:#059669;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m4 12 6 6L20 6"/></svg>지원 가능</span>
    </div>

    <!-- 발송 안내 -->
    <div style="background:#FAFAF7;border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6;color:#4A4A48;margin-bottom:16px;">
      프로필과 사진이 <b>divaent@naver.com</b>으로 발송됩니다.<br>
      발송 후 <b>지원 탭</b>에서 열람·회신 상태를 확인할 수 있어요.
    </div>

    <div style="background:#4F46E5;border-radius:12px;padding:16px;text-align:center;color:#FFFFFF;font-size:15px;font-weight:700;margin-bottom:10px;">지원서 발송</div>
    <div style="text-align:center;font-size:13px;color:#8A8A86;padding:13px 6px;">프로필 수정하기</div>
  </div>
</div>
</x-dc>
</body>
</html>
