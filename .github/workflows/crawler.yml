name: Daily Audition Crawler + SNS Auto-Publish

on:
  schedule:
    - cron: "0 18 * * *"  # UTC 18:00 = KST 03:00 (크롤링)
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00 (아침 게시)
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: "크롤링 건너뛰기 (콘텐츠 생성+게시만)"
        type: boolean
        default: false
      skip_publish:
        description: "자동 게시 건너뛰기 (크롤링+생성만)"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.schedule != '0 0 * * *' &&
      github.event.inputs.skip_crawl != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: 의존성 설치
        run: |
          pip install -r crawler/requirements.txt
          playwright install chromium --with-deps

      - name: 크롤러 실행
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REFINE_ENABLED: "1"
          # 트랙 A-1 네이버 카페 (NAVER API HUB). vars.NAVER_CAFE_ENABLED=1 로 켬
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          NAVER_CAFE_ENABLED: ${{ vars.NAVER_CAFE_ENABLED }}
        run: python main.py

  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [crawl]
    if: >-
      always() &&
      (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: 의존성 설치
        run: |
          pip install -r crawler/requirements.txt
          # Pillow용 한글 폰트 설치
          sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 콘텐츠 생성 + SNS 자동 게시
        working-directory: crawler/instagram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ "${{ github.event.inputs.skip_publish }}" = "true" ]; then
            python generate.py --type all
          else
            python generate.py --type all --publish
          fi
