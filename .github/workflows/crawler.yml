name: Audition Crawler + Channel Drafts

on:
  schedule:
    - cron: "0 18 * * *"  # UTC 18:00 = KST 03:00 (크롤링)
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00 (아침 게시)
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: "크롤링 건너뛰기 (콘텐츠 생성+게시만)"
        type: boolean
        default: false
      skip_publish:
        description: "자동 게시 건너뛰기 (크롤링+생성만)"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [core, cafe, web, backtrace]
    concurrency:
      group: audition-crawl-${{ matrix.group }}
      cancel-in-progress: false
    if: >-
      github.event.schedule != '0 0 * * *' &&
      github.event.inputs.skip_crawl != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: 의존성 설치
        run: |
          pip install -r crawler/requirements.txt
          playwright install chromium --with-deps

      - name: 크롤러 실행
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REFINE_ENABLED: "1"
          CRAWLER_GROUP: ${{ matrix.group }}
          PYTHONUNBUFFERED: "1"
          # 트랙 A-1 네이버 카페 (NAVER API HUB). vars.NAVER_CAFE_ENABLED=1 로 켬
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          NAVER_CAFE_ENABLED: ${{ vars.NAVER_CAFE_ENABLED }}
          # 소스 사망 경보 (30 마스터플랜 2-4) — 둘 다 있어야 발송됨
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python main.py

  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [crawl]
    if: >-
      always() &&
      (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: 의존성 설치
        run: |
          pip install -r crawler/requirements.txt
          # Pillow용 한글 폰트 설치
          sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 콘텐츠 초안 생성
        working-directory: crawler/instagram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python generate.py --type all

      - name: 게시 초안 보관
        uses: actions/upload-artifact@v4
        with:
          name: channel-drafts-${{ github.run_id }}
          path: crawler/instagram/output/
          retention-days: 14

      - name: SNS 연결 상태 확인
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_ACCOUNT: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCOUNT: ${{ secrets.THREADS_USER_ID }}
        run: |
          echo '## 유입 채널 준비 상태' >> "$GITHUB_STEP_SUMMARY"
          for platform in Instagram Threads; do
            if [ "$platform" = Instagram ]; then token="$IG_TOKEN"; account="$IG_ACCOUNT"; else token="$THREADS_TOKEN"; account="$THREADS_ACCOUNT"; fi
            if [ -n "$token" ] && [ -n "$account" ]; then
              echo "- $platform: 인증 값 등록됨. 게시 초안 검토 후 발행." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$platform 인증 미등록: 실제 게시 0건, 초안만 생성했습니다."
              echo "- $platform: 미연결, 실제 게시 0건." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
